[project]
name = "infopave-mcp"
version = "0.1.0"
description = "MCP server for FHWA LTPP pavement performance data (InfoPave): sections, materials, performance, climate, traffic, maintenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "duckdb>=1.1,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.0"]
build = ["pyodbc>=5.0", "pyarrow>=15"]   # data_pack/build.py: SQL Server tables -> Parquet
eval = ["anthropic[bedrock]>=0.40", "openpyxl>=3.1"]   # eval/local/run_agent_eval.py, eval/local/run_workbook_eval.py

[project.scripts]
# Lets you run the server with `uv run infopave-mcp`.
infopave-mcp = "infopave_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infopave_mcp"]

[dependency-groups]
# Install with `uv sync --group dev`.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = ["*.md", "eval/databricks"]  # eval/databricks = template Databricks eval kit (not ours)
src = ["src", "eval", "data_pack", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long SQL and table lines are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests can import the `eval` package
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/infopave_mcp"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
